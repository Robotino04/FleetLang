[package]
name = "fleetls"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.11"
fleetls-lib = { path = "../fleetls-lib" }
futures = "0.3.34"
log = "0.4.34"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
